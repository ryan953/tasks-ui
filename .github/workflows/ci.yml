name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      # The integration suite drives the real CLI against a throwaway store. It
      # skips itself when dex is missing, so installing it here is what makes those
      # tests actually run.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dex
        run: npm install -g @zeeg/dex

      # Temporary: every dex call timed out on the runner while taking 0.3s
      # locally. Find out what it is doing before guessing at a fix.
      - name: Diagnose dex on the runner
        run: |
          set -x
          which dex
          dex --help >/dev/null && echo "help ok"
          time (dex --storage-path /tmp/diag create -n "probe" --description "d" || echo "CREATE FAILED $?")
          time (dex --storage-path /tmp/diag list --json || echo "LIST FAILED $?")
          echo "--- with stdin closed, as the app runs it ---"
          time (dex --storage-path /tmp/diag2 create -n "probe2" --description "d" < /dev/null || echo "FAILED $?")
          echo "--- git context ---"
          git rev-parse --show-toplevel || true
          git remote -v || true
        timeout-minutes: 5

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test

      - name: Build the app bundle
        run: Scripts/bundle.sh --version 0.0.0-ci

      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: view-snapshots
          path: .build/snapshots/
          if-no-files-found: ignore
