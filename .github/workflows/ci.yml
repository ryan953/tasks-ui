name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      # Config in .swift-format; the toolchain ships the formatter, so there is
      # nothing to install or pin.
      - name: Lint
        run: swift format lint --recursive --strict Sources Tests

      # The integration suite drives the real CLI against a throwaway store. It
      # skips itself when dex is missing, so installing it here is what makes those
      # tests actually run.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dex
        run: npm install -g @zeeg/dex

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test

      - name: Build the app bundle
        run: Scripts/bundle.sh --version 0.0.0-ci

      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: view-snapshots
          path: .build/snapshots/
          if-no-files-found: ignore
