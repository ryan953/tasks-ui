name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 1.2.3)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dex
        run: npm install -g @zeeg/dex

      - name: Test
        run: swift test

      # Universal so the download runs on both Apple silicon and Intel.
      - name: Build the app bundle
        run: Scripts/bundle.sh --version "${{ steps.version.outputs.version }}" --universal

      - name: Check the binary is universal
        run: lipo -info "dist/Dex Tasks.app/Contents/MacOS/DexUI"

      - name: Zip the app
        run: |
          cd dist
          # ditto keeps the bundle's resource forks and symlinks; `zip` does not.
          ditto -c -k --sequesterRsrc --keepParent "Dex Tasks.app" \
            "DexTasks-${{ steps.version.outputs.version }}-macos-universal.zip"

      - name: Write the release notes
        run: |
          cat > notes.md <<'NOTES'
          ## Install

          1. Download the zip, unzip it, and drag **Dex Tasks.app** to `/Applications`.
          2. This build is not signed with an Apple Developer certificate, so the
             first launch needs **right-click → Open** (once), or:

             ```
             xattr -dr com.apple.quarantine "/Applications/Dex Tasks.app"
             ```

          Requires macOS 14 or later, and the `dex` CLI on your `PATH`.
          NOTES

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          ASSET="dist/DexTasks-${VERSION}-macos-universal.zip"
          # Re-running the workflow for an existing tag should refresh the asset
          # rather than fail outright.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --title "Dex Tasks ${VERSION}" \
              --notes-file notes.md
          fi
