name: Release

# On demand only: a tag push should not decide when something ships.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 1.2.3)"
        required: true

permissions:
  contents: write

# The Homebrew cask is not updated from here. ryan953/homebrew-tap reads the
# published releases of every entry it carries and bumps itself, so a release
# needs no write access to another repository and no token to hold it.
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Work out the version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dex
        run: npm install -g @zeeg/dex

      - name: Test
        run: swift test

      # Universal so the download runs on both Apple silicon and Intel.
      - name: Build the app bundle
        run: Scripts/bundle.sh --version "${{ steps.version.outputs.version }}" --universal

      - name: Check the binary is universal
        run: lipo -info "dist/Tasks.app/Contents/MacOS/Tasks"

      - name: Zip the app
        run: |
          cd dist
          # ditto keeps the bundle's resource forks and symlinks; `zip` does not.
          ditto -c -k --sequesterRsrc --keepParent "Tasks.app" \
            "Tasks-${{ steps.version.outputs.version }}-macos-universal.zip"

      - name: Write the release notes
        run: |
          cat > notes.md <<'NOTES'
          A native macOS app for your work in one window: [dex](https://www.npmjs.com/package/@zeeg/dex)
          tasks, and the Linear issues and projects assigned to you. List on the
          left, the thing you picked on the right, editable in place.

          ## Install

          ```sh
          brew install --cask ryan953/tap/tasks-ui
          ```

          Or download the zip below, unzip it, and drag **Tasks.app** to
          `/Applications`.

          The build is ad-hoc signed rather than notarized, so the first launch
          needs **right-click → Open** (once), or:

          ```sh
          xattr -dr com.apple.quarantine "/Applications/Tasks.app"
          ```

          Launch it once from `/Applications` so macOS registers the `task://`
          links.

          ## Requirements

          - macOS 14 or later. The build is universal, so it runs natively on both
            Apple silicon and Intel.
          - `dex` **0.16 or newer** on your `PATH`: `npm install -g @zeeg/dex`.
            Older stores are still readable, but writing needs the 0.16 command
            line, and the app says so plainly if it finds an older one.
          - Linear is optional. If the [`linear` CLI](https://github.com/schpet/linear-cli)
            is installed and logged in, its key is used automatically; otherwise add
            a personal API key in Settings. Either way it is kept in your keychain.

          ## Links

          | Link | Opens |
          | --- | --- |
          | `task://dex/<id>` | that dex task |
          | `task://<id>` | the same, shorthand |
          | `task://linear/ABC-12` | that Linear issue |
          | `task://linear/project/<id>` | that Linear project |
          NOTES

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          ASSET="dist/Tasks-${VERSION}-macos-universal.zip"
          # Re-running the workflow for an existing tag should refresh the asset
          # rather than fail outright.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --title "Tasks ${VERSION}" \
              --notes-file notes.md
          fi
